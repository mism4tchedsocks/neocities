        <h1>my dialect</h1>
        <a href="/">home</a> / <a href="/shrines/index.html">collections</a>
        <p>
            i don't know how to go about this without doxxing myself. i also don't know what i want to do with this. fuck around and find out<br>my dialect is often seen as the closest to old dutch from all the dialects in my country. it's also the dialect with the most speakers today, though that number is receding. the rules have softened a bit, but my grandparents had to speak proper dutch at school, and spoke dialect at home. my parents, and they definitely weren't alone in this, decided to not speak dialect to me. to make things easier. the result of this is that dialects all around the country are disappearing, and that everyone speaks a weird mix of proper dutch and dialect. this is called "tussentaal", "in-between language".<br>
            difference dialect and accent: an accent is sounds, a dialect is words and grammar and sounds. my dialect is not recognised as a language. i don't think it needs to be, but i think it and other language variations should be treater better.
        </p>
        <p>
            with tussentaal, i know i sounded like i was from my region, but i wouldnt have been able to communicate with many elders (or so i was told). my grandparents often laughed at me for not knowing dialect, but also never spoke it to me. it's not like anyone ever spoke it to me. i took drama classes where we also learned how to actually pronounce things properly. this was at the same time my parents and grandparents started speaking dialect around me and sometimes even towards me more, so my grades in that class started dropping lol.
        </p>
        <p>
            i think it's also important to note that our dialect is extremely different from location to location. i don't know what it's like in other countries so i can't compare. but for example, some dutch words have a "sg" sound, written like "sch". where i'm from we pronounce that like "sk", while my cousins who live 20km away pronounce that like "sj".<br>
            this makes it difficult to standardize the dialect - not that i think that's needed. but if you want to learn it, you need to learn from your elders. there are some dictionaries but again, it's very local. technically where i'm from, we fall under city A, my aforementioned cousin's town <i>also</i> falls under city A.<br>
            most of those dictionaries were also published before 2010. our day to day language has evolved more, with the tussentaal's influence and of course also the digital age and migration. in big cities there's definitely a morrocan influence in the "jongerentaal", the "youth language", and everywhere english starts seeping in more. until now the biggest influence in my dialect has been french, and lots of elders resist the englishification of our dialects. i think it's sad that the language my grandparents spoke is disappearing but i think it's also a beautiful thing. our dialect has always been a mix of french and dutch, and english has also been a part of it due to the trade between belgium and england. i love my little language soup dialect.
        </p>
        <p>
            ive gotten pretty good at understanding our dialect now, though speaking isn't amazing. my pronounciation of words is often wrong, my grammar questionable, etc etc. but language evolves, and that's a good thing. i'm never going to speak the same dialect as my parents, just like they didn't speak the same dialect as their parents and so on. most elderly people i know <i>do</i> speak (more or less) proper dutch, contrary to what my grandparents told me, because they were forced to speak that in schools and often also at work. my proper dutch is getting worse and worse, which i'll have to work on if i want to go into education.
        </p>
        <p>
            i sometimes feel like my dialect is still seen as inferior to other dialects. maybe because its the one that has survived the most. maybe because were still seen as conservative farmers (and of course farmer = dumb). in my area, west flemish teachers tried their best to speak proper dutch and hide their accent, but if i had a teacher from another region they just spoke in their own accent. my accent is seen as funny and not understandable. and yes of course i'll try to speak as proper as possible when i meet someone from another region, but jesus.
        </p>
        <p>
            ghent had industry, limburg had mines, brussels is The City, antwerp had industry as well and is The City, west flanders is farmland. its all bullshit of course. 
        </p>
