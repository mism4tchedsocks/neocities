  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link id="stylesheet" title="default" type="text/css" rel="stylesheet" href="/css/min.css">
  <style>
:root {
    --bg: #ffffff;
    --body: #000000;
    --accent:#ff0000;
}
body {
    /*background-color: var(--body);
    color:var(--bg);*/
}
.page {
    background-color: var(--bg);
    color:var(--body);
    border:var(--body) 2px solid;
    padding:5px;
    width:80vw;
    margin:0 auto;
    margin-bottom:15px;
}
img {
  height:15vw !important;
}
header h1 {
    margin-bottom: 0;
    margin:0 auto;
}
.top {display:none;}
header { text-align: center;}
main {
    padding: 20px;
    display:grid;
    grid-template-areas:"overview overview" "content1 content2";
    grid-template-columns: 1fr 1fr;
    gap:30px;
}
.item {
border: 2px solid var(--body);
padding: 15px;
max-height:30vw;
overflow-y: scroll;
margin-bottom:30px;
}
h2 {
    margin-top:0;
    margin-bottom:0;
}
ul {
    margin-top:0;
}
main > div.content1 {
  grid-area: content1;
}
main > div.content2 {
grid-area: content2; 
}
main > div.overview {
grid-area: overview;
}
@media only screen and (max-width: 900px) {
    main {
        padding: 10px;
        display:flex;
        flex-direction: column;
        flex-wrap: nowrap;
        word-break: normal;
    }
    .item {
        border: 2px solid var(--body);
        padding: 5px;
        max-height:auto;
        overflow-y:visible;
        margin-bottom:10px;
        width: 90%;
    }
    .item h2 {
        margin:0;
        padding-left:5px;
    }
    .page {
        width:90%;
    }
    .top {
        display:inline;
        position:sticky;
        top:10px;
        background-color: var(--accent);
        color:var(--bg);
        border-radius:5px;
        text-transform:uppercase;
        padding:10px;
        width:fit-content;
    }
}
  </style>
</head>
