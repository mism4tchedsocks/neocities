    <style>
    
    .box1 a { 
            color: #edce00;
        }
        ::selection { 
            background-color: #edce00;
        }
        a::selection { background-color:#edce00; color:#1a3555; }
    h2, h3 { margin:0}
    body {
        font-size:1.1rem;
        background-image: url(/artimg/Aroace_flag.png);
        background-size: contain;
        background-attachment: fixed;
    }
    .box6 {
        display:grid;
        grid-template-areas:"content1 content2 content3";
        grid-template-columns: 1fr 1fr 1fr;
        gap:30px;
    }
    figure {
        margin:0;
    }
    figcaption {
        font-size:1rem;
        text-align:left;
        display:block;
        border-top: 2px dotted black;
        background-color: white;
    }
    .pin img { width:100%;}
    .pin { 
        background-color: white;
        border: 2px solid var(--body-color); 
        padding:15px;
        margin:auto; 
        margin-bottom: 25px; 
        word-break: keep-all;
    }
    .img {
        border: none !important; 
        padding:0;
        margin:auto;
        background-color: transparent;
    }
    .pin ul {font-style:italic;}   
    .pin li {font-style:normal;}
    .pinned {
        background-color: var(--body-color);
        color:var(--body-bg-color);
    }
    .newpin::before {
    content:"NEW NEW NEW NEW NEW NEW NEW NEW";
    font-family:var(--strong-font);
    font-size:0.7rem;
    background-color:var(--accent-color);
    color:var(--body-bg-color);
    padding:0.25em;
    border-radius:5px;
    margin-bottom:0.5em;
    line-height:1;
    font-weight:normal;
    position:relative;
    top:-0.125em;
    }
    .wrapper {
        overflow-y:scroll;
        overflow-x:hidden;
        display: grid;
        margin:auto;
    }
    .box6 > div.content1 {
    grid-area: content1;
    }
    .box6 > div.content2 {
    grid-area: content2; 
    }
    .box6 > div.content3 {
    grid-area: content3;
    }
@media only screen and (max-width: 900px) {

    h2, h3 { margin:0}
    .box6 {
        display:flex;
        flex-direction: column;
        flex-wrap: wrap;
    }
    .content1, .content2, .content3 { 
        width:100%;
        display:flex;
        flex-direction: column;
        margin-bottom:0;
        padding-bottom:0;
    }
    figcaption {
        font-size:1rem;
        text-align:left;
        display:block;
        border-top: 2px dotted black;
    }
    .pin img { max-height:100%;}
    .img {
        display: none;
    }
    .pin { 
        border: 2px solid var(--body-color); 
        padding:0;
        margin:auto; 
        margin-bottom: 15px; 
        word-break: keep-all;
        max-height: 60vw;
        overflow-y: scroll;
        width:100%;
    }
    .pin ul {font-style:italic;}   
    .pin li {font-style:normal;}
    .pinned {
        background-color: var(--body-color);
        color:var(--body-bg-color);
    }
    .newpin::before {
    content:"NEW NEW NEW NEW";
    font-family:var(--strong-font);
    font-size:1.2rem;
    background-color:var(--accent-color);
    color:var(--body-bg-color);
    padding:0.25em;
    border-radius:5px;
    margin-bottom:0.5em;
    line-height:1;
    font-weight:normal;
    margin-left:0;
    position:relative;
    top:0.425em;
    }
}
