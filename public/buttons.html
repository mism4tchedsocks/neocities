<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" media="screen" href="/css/min.css">
    <title>Document: button wall</title>
    <style>
        main { display:flex; flex-wrap:wrap;gap:25px;}
    .pin { 
        border: 2px solid black; 
        padding:5px;
        margin-bottom:5px;
        display:flex;
        flex-direction: row;
    }
    figure {
        margin:0;
    }
    .pin img {
        height:31px;
        width:88px;
    }
    figcaption {
        margin-left:5px;
        padding-left:5px;
        border-left: 3px dotted var(--body);
        max-width:20vw;
    }
    .blank {border:1px solid black;}
    </style>
</head>
<body>
    <header>
        <h1>button wall</h1>
        <p>/favourite websites!! forever changing and growing and wip-ing</p>
        <a href="/">go home</a> / <a href="/about.html">back to about</a>
    </header>
    <main>
        <figure class="pin">
            <a href="https://caesthoffe.neocities.org" target="_blank"><img src="/buttons/caesthoffe.gif" style="border:solid 3x transparent;border-radius:5px;width:88px;" loading="lazy"></a>
            <figcaption>caesthoffe: love love love this site.</figcaption>
        </figure>
        <figure class="pin">
            <a href="https://wichitalk.neocities.org/" target="_blank"><img src="/buttons/wichitalk.png" style="height:31px; width:auto;" loading="lazy"></a>
            <figcaption>wichitalk: absolutely in love with this site. fuck yeah minimalism!!!!!</figcaption>
        </figure>
        <figure class="pin">
            <a href="https://liedown1.neocities.org/" target="_blank"><img src="/buttons/liedown1.png" style="height:31px; width:auto;" loading="lazy"></a>
            <figcaption>liedown1: another one of my absolute favourites. i love getting lost here, i always find new pages to explore.</figcaption>
        </figure>
        <figure class="pin">
            <a href="https://michaelmas.neocities.org/" target="_blank"><img src="/buttons/michaelmas.png" loading="lazy"></a>
            <figcaption>michaelmas: writing and blogging and and and.</figcaption>
        </figure>
        <figure class="pin">
            <a href="https://malcriada.neocities.org/" target="_blank"><img src="/buttons/malcriada.png" style="height:31px; width:auto;" loading="lazy"></a>  
            <figcaption>malcriada: impeccable vibes. favourite page: all of them</figcaption>
        </figure>
        <figure class="pin">
            <a href="https://callus.neocities.org/" target="_blank"><img src="/buttons/callus.png" loading="lazy"></a>
            <figcaption>callus: art project that always makes me motivated to try out my coloured pencils again</figcaption>
        </figure>
        <figure class="pin">
            <a href="https://ciel.neocities.org/" target="_blank"><img src="/buttons/ciel.png" loading="lazy"></a>
            <figcaption>ciel: love to explore the photography pages</figcaption>
        </figure>
        <figure class="pin">
            <a href="https://book-wormy.neocities.org/" target="_blank"><img src="/buttons/blank.jpeg" class="blank"loading="lazy"></a>
            <figcaption>book-wormy: more photography!! this is the website that inspired me to buy a compact camera :D</figcaption>
        </figure>
        <figure class="pin">
            <a href="https://girl-wonderlost.neocities.org/" target="_blank"><img src="/buttons/blank.jpeg" class="blank" style="border:1px solid black;" loading="lazy"></a>
            <figcaption>girl-wonderlost: every time i check back there's a new page to explore. it's like a magical garden of some sorts, i don't know how to explain. go explore for yourself</figcaption>
        </figure>
        <figure class="pin">
            <a href="https://olliveen.neocities.org/" target="_blank"><img src="/buttons/olliveen.gif" style="height:31px; width:auto;" loading="lazy"></a>
            <figcaption>olliveen: i love </figcaption>
        </figure>
        <figure class="pin">
            <a href="https://fairygore.neocities.org" target="_blank"><img src= "/buttons/fairygore.png" style="width:88px" alt="fairygore" loading="lazy"></a>
            <figcaption>fairygore: hallo test</figcaption>
        </figure>
        <figure class="pin">
            <a href="https://ridvenge.neocities.org/" target="_blank"><img src="/buttons/ridvenge.gif" style="height:31px; width:auto;" loading="lazy"></a>
            <figcaption>ridvenge: </figcaption>
        </figure>
        <figure class="pin">
            <a href="https://winter537.org/" target="_blank"><img src="/buttons/blank.jpeg" class="blank"loading="lazy"></a>
            <figcaption>winter537: </figcaption>
        </figure>
        <figure class="pin">
            <a href="https://diaryofalady.neocities.org/" target="_blank"><img src="/buttons/blank.jpeg" class="blank"loading="lazy"></a>
            <figcaption>diary of a lady: </figcaption>
        </figure>
</main>
</body>
</html>
