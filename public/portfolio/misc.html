<!DOCTYPE html>
<html lang="en">
<head>
    <title>other</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" media="screen" href="/css/min.css">
    <style>
        nav { position:sticky;top:10px;}
        main p {
            margin-top:20px;
        }
    nav a {margin-bottom:0;font-size:1.2rem;}
    main {
        display:flex;
        flex-wrap: wrap;
        gap:30px;
        padding:0;
        width:80%;
    }
    .item { 
        border: 2px solid var(--body); 
        padding:15px;
        word-break: keep-all;
        margin-bottom:2vw;
    }
    .item img {
        display:inline-block;
        width: 100%;
    }
    .item h3 {
        margin:0;
        padding-bottom:5px;
        margin-bottom:10px;
        border-bottom:2px dotted var(--body);
    }
    .date {
        font-size:0.7rem;
        margin-top:10px;
        padding-top:10px;
        border-top:2px dotted var(--body);
    }    
    .top {display:none;}
    .row {display: flex;flex-direction: row;}
    figure {
        margin:0;
    }
@media only screen and (max-width: 900px) {
    nav {
        position: static;
        width:100%;
    }
    figure {
        margin:0 auto;
    }
    main {
        display:flex;
        flex-direction: column;
        flex-wrap: nowrap;
        padding:0;
        width:100%;
    }
    .item img { width:100%;}
    .item { 
        border: 2px solid var(--body); 
        padding:15px;
        word-break: keep-all;
        margin-bottom:0;
    }
    .item h3 {
        margin:0;
        padding-bottom:5px;
        margin-bottom:10px;
        border-bottom:2px dotted var(--body);
    }
    .date {
        font-size:0.7rem;
        margin-top:10px;
        padding-top:10px;
        border-top:2px dotted var(--body);
    }
    .top {
        display:inline;
        position:sticky;
        top:10px;
        background-color: var(--accent);
        color:var(--bg);
        border-radius:5px;
        text-transform:uppercase;
        padding:10px;
        width:fit-content;
    }
button {
    border:1px solid var(--accent);
    color:var(--accent);
    background-color: var(--bg);
    padding:15px;
    border-radius: 5px;
    text-transform: uppercase;
}
button:hover {
    border:1px solid var(--accent);
    color:var(--bg);
    background-color: var(--accent);
}
        nav { position:relative;top:10px;}
}
    </style>
</head>
<body>
        <header id="top">
            <h1>other works</h1>
            <a href="/">home</a> / <a href="/portfolio/index.html">portfolio</a>
            <p>all kinds of other projects.</p>
        </header>
        <main>
            <a href="#top" class="top">BACK TO TOP</a>
                <figure class="item" id="troost2025ILL"><h3>troost / consolation</h3>
                    <img src="/artimg/misc/oranjeman.jpg" alt="">
                    <img src="/artimg/misc/oranjeman-raam.jpg" alt="">
                    <figcaption>
                        rush assignment in illustration. we picked a sentence out of a magazine or newspaper and made an illustration to accompany it.
                        <cite>troost is als een rommeltje zonder mond<br>/<br>consolation is like a mess without a mouth</cite>
                        <div class="date">december 2, 2025</div>
                    </figcaption>
                </figure>

                <figure class="item" id="chair2025GR"><h3>chair, tea, soap: abc (letterfeest)</h3>
                    <img src="/artimg/misc/mod-drogenaald.png" alt="">
                    <figcaption>
                        first dry etched print.
                        <div class="date">september-october 2025</div>
                    </figcaption>
                </figure>
       </main>
		<script src="https://www.w3schools.com/lib/w3.js"></script>
		<script>
			w3.includeHTML(myCallback);

			function myCallback() {
				// first slideshow with buttons - adamkadmon
				var myShow1 = w3.slideshow(".button1", 0);
				document.getElementById("previous1").addEventListener("click", function(){myShow1.previous();});
				document.getElementById("next1").addEventListener("click", function(){myShow1.next();});
				// second slideshow with buttons - vlaanderen, mijn land
				var myShow2 = w3.slideshow(".button2", 0);
				document.getElementById("previous2").addEventListener("click", function(){myShow2.previous();});
				document.getElementById("next2").addEventListener("click", function(){myShow2.next();});
				// third slideshow with buttons - associaties
				var myShow3 = w3.slideshow(".button3", 0);
				document.getElementById("previous3").addEventListener("click", function(){myShow3.previous();});
				document.getElementById("next3").addEventListener("click", function(){myShow3.next();});
			}		
		</script>
</body>
</html>
