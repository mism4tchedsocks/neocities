<!DOCTYPE html>
<html lang="en">
<head>
    <title>mini comics</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" media="screen" href="/css/min.css">
    <style>
    .comic img { max-width:100%;}
    .comic { 
        border: 2px solid var(--body-color); 
        padding:15px;
        word-break: keep-all;
    }
    .comic h3 {
        margin:0;
        padding-bottom:5px;
        margin-bottom:10px;
        border-bottom:2px dotted var(--body-color);
        
    }
    .date {
        font-size:0.7rem;
        margin-top:10px;
        padding-top:10px;
        border-top:2px dotted var(--body-color);
    }
        nav { position:sticky;top:10px;}
@media only screen and (max-width: 900px) {
    .box2 {
        position: static;
        max-width:100% !important;
    }
    .box3 {
        display:flex;
        flex-direction: column;
        flex-wrap: nowrap;
        padding:0;
    }
    .comic img { max-width:100%;}
    .comic { 
        border: 2px solid var(--body-color); 
        padding:15px;
        word-break: keep-all;
    }
    .comic h3 {
        margin:0;
        padding-bottom:5px;
        margin-bottom:10px;
        border-bottom:2px dotted var(--body-color);
    }
    .date {
        font-size:0.7rem;
        margin-top:10px;
        padding-top:10px;
        border-top:2px dotted var(--body-color);
    }
    .box6 {
        display:flex;
        flex-direction: column;
        flex-wrap: wrap;
    }
    .content1, .content2, .content3 { 
        width:100%;
        display:flex;
        flex-direction: column;
    }
    figure {
        display:inline-block;
        margin:0;
        padding: 15px;
    }
    figcaption {
        width:100%;
        word-wrap:break-word;
    }
    figure img {
        width:100%;
    }
    .top {
        display:inline;
        position:sticky;
        top:10px;
        background-color: var(--accent-color);
        color:var(--body-bg-color);
        border-radius:5px;
        text-transform:uppercase;
        padding:10px;
        width:fit-content;
    }
}
</style>
</head>
<body>
        <header id="top">
            <h1>mini comics</h1>
            <a href="/">home</a> / <a href="/portfolio/index.html">portfolio</a>
                <p>very shitty quality but hey i made something with my own hands :> always loved journal comics so yippee i drew a few and immediately made a page for them!!!!</p>

        </header>
        <nav>
            <a href="#top">top</a>
            <a href="#assessment">assessment</a>
            <a href="#nipples">nipples</a>
        </nav>
        <main>
            <div class="content1">
                <div class="comic" id="assessment"><h3>assessment</h3>
                    <img src="/artimg/comics/assessment-1.jpg" alt="">
                    <img src="/artimg/comics/assessment-2.jpg" alt="">
                    <img src="/artimg/comics/assessment-3.jpg" alt="">
                    <div class="date">21 march 2026</div>
                </div>
            </div>
            <div class="content2">
                <div class="comic" id="nipples"><h3>nipples</h3>
                    <!--<img src="/artimg/comics/nipples-1.png" alt="">-->
                    <img src="/artimg/comics/nipples-2.png" alt="">
                    <div class="date">22 march 2026</div>
                </div>
            </div>
        </main>
</body>
</html>
